###############################################
# MediaMTX Simple Configuration

# Log configuration
logLevel: info
logDestinations: [stdout]

# Timeouts
readTimeout: 10s
writeTimeout: 10s

# RTMP server
rtmp:
  disable: false
  rtmpAddress: :1935

# HLS server - ULTRA LOW LATENCY  
hls:
  disable: false
  hlsAddress: :8888
  hlsAllowOrigin: '*'
  hlsSegmentCount: 2          # Mínimos segmentos (reduce latencia)
  hlsSegmentDuration: 500ms   # Segmentos de 0.5 segundos (menos latencia)
  hlsPartDuration: 100ms      # Sub-partes de 100ms (ultra baja latencia)
  hlsSegmentMaxAge: 5s        # Limpia segmentos viejos rápido

# WebRTC server
webrtc:
  disable: false
  webrtcAddress: :8889
  webrtcAllowOrigin: '*'

# Default path configuration
paths:
  all:
    source: publisher
    sourceOnDemand: false
    runOnDemand: false
    publishUser: ''
    publishPass: ''
    readUser: ''
    readPass: ''
  
  # Specific configuration for browser_stream with HLS enabled
  browser_stream:
    source: publisher
    sourceOnDemand: false
    runOnDemand: false